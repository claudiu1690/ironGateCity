# Local MongoDB: a single-node replica set (transactions need one).
# MONGODB_URI=mongodb://127.0.0.1:27017/irongate?replicaSet=rs0&directConnection=true
# The member host is 127.0.0.1 so the Windows host can reach the primary.
services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes: ['mongo_data:/data/db', 'mongo_config:/data/configdb']
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"
      interval: 5s
      timeout: 30s
      retries: 30
volumes: { mongo_data: {}, mongo_config: {} }
