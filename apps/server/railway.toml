# Railway service config for the API. Point the service's "Config as code" path at
# apps/server/railway.toml and build from the repository root.
# The worker is a second service from the same Dockerfile with the start command
# `node dist/worker.js` and no health check.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/server/Dockerfile"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
