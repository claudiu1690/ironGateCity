  <rect x="90" y="136" width="76" height="8" fill="#EFE6D2"/>
  <g fill="#EFE6D2"><rect x="96" y="146" width="8" height="28"/><rect x="112" y="146" width="8" height="28"/><rect x="136" y="146" width="8" height="28"/><rect x="152" y="146" width="8" height="28"/></g>
  <rect x="84" y="176" width="88" height="8" fill="#EFE6D2"/>
  <!-- ballot slot -->
