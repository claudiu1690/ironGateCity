<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>City map — Irongate, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;family=Oswald:wght@400;500;600&amp;family=Courier+Prime:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#15181A}
.lbl{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.14em}
.poi{position:absolute;width:44px;height:44px;transform:translate(-22px,-22px);display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer}
.poi-num{width:32px;height:32px;border-radius:50%;background:#15181A;color:#EFE6D2;border:2px solid #EFE6D2;box-shadow:0 0 0 2px #15181A,0 3px 8px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-family:Oswald,sans-serif;font-weight:600;font-size:14px;box-sizing:border-box}
.poi-sel .poi-num{background:#EFE6D2;color:#15181A;border-color:#15181A;box-shadow:0 0 0 2px #EFE6D2,0 0 0 8px rgba(239,230,210,.35)}
.ticket{display:flex;background:#F6F0E1;border:1px solid #15181A;min-height:66px}
.stub{width:54px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-right:1.5px dashed #15181A}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex-grow:1;color:#B8B09F;text-decoration:none;font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;position:relative;min-height:56px}
.tab-on{color:#EFE6D2;box-shadow:inset 0 3px 0 #EFE6D2}
a{color:#8C2B23}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #15181A; color: #EFE6D2; font-family: 'Source Serif 4', Georgia, serif">

<div style="position: absolute; left: 0; top: 56px; width: 390px; height: 724px; overflow: hidden">
<div style="position: absolute; left: -140px; top: 0; width: 776px; height: 520px">
<img src="{{mapSrc}}" alt="Detailed illustrated map of central Irongate: Parliament, market square, tram junction, the station and the river" style="width: 776px; height: 520px; display: block">
<sc-for list="{{pois}}" as="p" hint-placeholder-count="6">
<button type="button" class="{{p.cls}}" style="left: {{p.left}}; top: {{p.top}}" onClick="{{p.pick}}" aria-label="{{p.name}}" aria-pressed="{{p.selected}}"><span class="poi-num">{{p.n}}</span></button>
</sc-for>
</div>
<div style="position: absolute; left: 10px; top: 10px; display: flex; align-items: stretch; background: #EFE6D2; color: #15181A; box-shadow: 0 0 0 1px #15181A, 0 6px 16px rgba(0,0,0,.4)">
<a href="MobileRegion.dc.html" aria-label="Back to region map" style="display: flex; align-items: center; justify-content: center; width: 44px; background: #15181A; color: #EFE6D2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="padding: 6px 12px; display: flex; flex-direction: column; gap: 1px">
<span style="font-family: 'Playfair Display', serif; font-weight: 900; font-size: 20px; line-height: 1">Irongate</span>
<span class="lbl" style="font-size: 9px; color: #5b564b">Station &amp; Market district · battleground</span>
</div>
</div>
</div>

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 56px; background: #15181A; border-bottom: 1px solid #3A4043; display: flex; align-items: center; gap: 10px; padding: 0 12px; box-sizing: border-box">
<img src="/_blob/64689c170d636886b2f7e8180d2d0c91" alt="Portrait of Mara Lenk" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: 50% 22%; border: 2px solid #8C2B23">
<div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1">
<div style="display: flex; gap: 6px; align-items: center"><span class="lbl" style="font-size: 9px; width: 16px; color: #D96B4B">HP</span><div style="flex-grow: 1; height: 5px; background: #3A4043"><div style="width: 86%; height: 5px; background: #D96B4B"></div></div></div>
<div style="display: flex; gap: 6px; align-items: center"><span class="lbl" style="font-size: 9px; width: 16px; color: #6FB3B0">EN</span><div style="flex-grow: 1; height: 5px; background: #3A4043"><div style="width: 64%; height: 5px; background: #6FB3B0"></div></div></div>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<span style="font-family: Oswald, sans-serif; font-size: 14px; font-weight: 500">64 / 100</span>
<span class="lbl" style="font-size: 9px; color: #6FB3B0">Rested 120</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-left: 8px; border-left: 1px solid #3A4043">
<span style="font-family: Oswald, sans-serif; font-size: 14px; font-weight: 500">4,210</span>
<span class="lbl" style="font-size: 9px; color: #B8B09F">Iron</span>
</div>
</div>

<div style="position: absolute; left: 0; bottom: 64px; width: 390px; background: #EFE6D2; color: #15181A; box-shadow: 0 -10px 30px rgba(0,0,0,.45); display: flex; flex-direction: column">
<div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 4px; background: #9b917a"></span></div>
<div style="padding: 6px 16px 10px; display: flex; flex-direction: column; gap: 4px; border-bottom: 2px solid #15181A">
<span class="lbl" style="font-size: 10px; color: #5b564b">{{cur.n}} · {{cur.kind}}</span>
<span style="font-family: 'Playfair Display', serif; font-weight: 900; font-size: 26px; line-height: 1.05">{{cur.name}}</span>
<span style="font-family: 'Courier Prime', monospace; font-size: 12px; color: #3d3a33">Here now: {{cur.presence}}</span>
</div>
<div style="padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 7px">
<sc-for list="{{cur.actions}}" as="ac" hint-placeholder-count="3">
<div class="ticket">
<div class="stub" style="background: {{ac.stubBg}}; color: {{ac.stubFg}}">
<span style="font-family: Oswald, sans-serif; font-weight: 600; font-size: 19px; line-height: 1">{{ac.cost}}</span>
<span class="lbl" style="font-size: 8px">{{ac.unit}}</span>
</div>
<div style="padding: 7px 10px; display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 15px; line-height: 1.15">{{ac.title}}</span>
<span style="font-family: 'Courier Prime', monospace; font-size: 11px; color: {{ac.tagColor}}">{{ac.tags}}</span>
</div>
<a href="MobileMission.dc.html" aria-label="Do this: {{ac.title}}" style="align-self: center; margin-right: 8px; width: 44px; height: 44px; background: #15181A; color: #EFE6D2; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 64px; background: #15181A; border-top: 1px solid #3A4043; display: flex">
<a href="MobileRegion.dc.html" class="tab tab-on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"></path></svg>Map</a>
<a href="MobilePaper.dc.html" class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"></rect><path d="M7 8h10M7 12h6M7 16h6M15 12h2v4h-2z"></path></svg>Paper</a>
<a href="MobileCity.dc.html" class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3z"></path></svg>Dossier</a>
<a href="MobileEvent.dc.html" class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>Faction</a>
<a href="Main.dc.html" class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Me</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"time":{"editor":"enum","options":["day","night"],"default":"day"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'market' };
  }
  renderVals() {
    const legal = (cost, title, tags, unit) => ({ cost, title, tags, unit: unit || 'Energy', stubBg: '#E2D6BB', stubFg: '#15181A', tagColor: '#5b564b' });
    const illegal = (cost, title, tags) => ({ cost, title, tags, unit: 'Energy', stubBg: '#15181A', stubFg: '#EFE6D2', tagColor: '#8C2B23' });
    const data = [
      { id: 'parliament', n: 1, name: 'Parliament', kind: 'Government Quarter', x: 0.43, y: 0.07, presence: '4 deputies · 11 strangers',
        actions: [legal('0', 'Watch today’s vote from the gallery', 'Universal Care Act · 24 h window'), legal('8', 'Lobby a deputy', 'Political · Rank 4 · 20 PC')] },
      { id: 'opera', n: 2, name: 'The Opera', kind: 'Government Quarter · society', x: 0.62, y: 0.19, presence: '2 Alliance · 1 Vanguard · 7 strangers',
        actions: [legal('6', 'Attend tonight’s performance', 'Social · CHA 15 · dress check'), legal('3', 'Watch the box of Senator Voss', 'Surveillance · safe window 9 s')] },
      { id: 'market', n: 3, name: 'Market Square', kind: 'Station & Market', x: 0.335, y: 0.41, presence: '2 Collective · 3 Alliance · 9 strangers',
        actions: [legal('10', 'Canvass the tram queue', 'Canvassing · Issue: Tram Fare Hike'), legal('3', 'Watch the fish stall', 'Surveillance · safe window 11 s'), illegal('8', 'Tear down Alliance posters', 'Vandalism · illegal · +6 Heat')] },
      { id: 'tram', n: 4, name: 'Tram Junction', kind: 'Station & Market', x: 0.48, y: 0.46, presence: '14 strangers',
        actions: [legal('0', 'Tram to Eastside', 'Between districts · instant, free'), legal('4', 'Sell intel at the kiosk', 'Dossier sale · 50–200 Iron')] },
      { id: 'station', n: 5, name: 'Central Station', kind: 'Station & Market', x: 0.51, y: 0.61, presence: '1 Collective · 22 strangers',
        actions: [legal('20', 'Board the 14:30 to Coalport', '12 min · third class', 'Iron'), legal('60', 'Book the night train', 'Leaves 22:40 · arrive 06:00 · +50 Rested', 'Iron')] },
      { id: 'blocks', n: 6, name: 'The Bombed Blocks', kind: 'Station & Market · housing', x: 0.235, y: 0.69, presence: '3 Collective · 5 strangers',
        actions: [legal('10', 'Canvass the repair crews', 'Canvassing · housing'), legal('100', 'Rent a room', 'Lodging · +25 Rested', 'Iron')] }
    ];
    const sel = this.state.sel;
    const pois = data.map((d) => ({
      ...d,
      left: (d.x * 100) + '%', top: (d.y * 100) + '%',
      selected: d.id === sel,
      cls: d.id === sel ? 'poi poi-sel' : 'poi',
      pick: () => this.setState({ sel: d.id })
    }));
    const night = (this.props.time ?? 'day') === 'night';
    return { mapSrc: night ? '/_blob/f0a505ec2e64b3530efac2805849347b' : '/_blob/8a46e8f251cd48dff909508b493455ef', pois, cur: pois.find((p) => p.id === sel) };
  }
}
</script>
</body>
</html>
